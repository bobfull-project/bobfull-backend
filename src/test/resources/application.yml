payment:
  expiration:
    enabled: false
  refund-reconciliation:
    enabled: false

spring:
  mail:
    host: localhost
    port: 1025

notification:
  email:
    from-address: no-reply@bobfull-test.com

cors:
  allowed-origins: http://localhost:5173

auth:
  refresh-token:
    expiration-seconds: 1209600

aws:
  region: ap-northeast-2
  s3:
    image-bucket: bobfull-test-image-bucket
    upload-url-expiration: 5m
    get-url-expiration: 5m
