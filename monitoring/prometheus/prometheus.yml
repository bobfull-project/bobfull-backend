global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: bobfull-backend
    metrics_path: /actuator/prometheus
    scheme: http
    file_sd_configs:
      - files:
          - /tmp/prometheus-targets/bobfull-backend.yml
        refresh_interval: 30s
