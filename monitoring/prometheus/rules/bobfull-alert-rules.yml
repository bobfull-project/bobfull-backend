groups:
  - name: bobfull-system-api
    rules:
      - alert: BobFullBackendDown
        expr: up{job="bobfull-backend"} == 0
        for: 1m
        labels:
          severity: critical
          category: system
        annotations:
          summary: BobFull backend Prometheus target is down
          description: Prometheus cannot scrape /actuator/prometheus from the backend target.

      - alert: BobFullHttp5xxDetected
        expr: sum(increase(http_server_requests_seconds_count{job="bobfull-backend",status=~"5.."}[5m])) > 0
        for: 0s
        labels:
          severity: warning
          category: api
        annotations:
          summary: BobFull backend returned 5xx responses
          description: One or more 5xx responses occurred in the last 5 minutes.

      - alert: BobFullP95LatencyTestThreshold
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="bobfull-backend",uri!="/actuator/prometheus"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          category: api
          threshold: test
        annotations:
          summary: BobFull API p95 latency is above the initial test threshold
          description: p95 latency is above 1 second for 5 minutes. Tune after AWS baseline measurement.

      - alert: BobFullHeapUsageHighTestThreshold
        expr: sum(jvm_memory_used_bytes{job="bobfull-backend",area="heap"}) / sum(jvm_memory_max_bytes{job="bobfull-backend",area="heap"}) > 0.8
        for: 5m
        labels:
          severity: warning
          category: jvm
          threshold: test
        annotations:
          summary: BobFull JVM heap usage is above the initial test threshold
          description: Heap usage is above 80 percent for 5 minutes. Tune after AWS baseline measurement.

      - alert: BobFullDbConnectionPending
        expr: max(hikaricp_connections_pending{job="bobfull-backend"}) > 0
        for: 1m
        labels:
          severity: warning
          category: db
        annotations:
          summary: BobFull DB connection pool has pending requests
          description: HikariCP pending connection count is greater than zero.

  - name: bobfull-business
    rules:
      - alert: BobFullCriticalBusinessEvent
        expr: sum by (event) (increase(bobfull_business_events_total{job="bobfull-backend",event=~"PAYMENT_COMPENSATION_REQUIRED|REFUND_COMPENSATION_REQUIRED|PORTONE_WEBHOOK_PROCESSING_FAILED|PAYMENT_WEBHOOK_PERMANENT_FAILURE|CHAT_ROOM_CREATION_REQUIRED|UNHANDLED_EXCEPTION"}[5m])) >= 1
        for: 0s
        labels:
          severity: critical
          category: business
        annotations:
          summary: BobFull critical business event occurred
          description: Critical event {{ $labels.event }} occurred at least once in the last 5 minutes. Check structured logs for identifiers and stack traces.

      - alert: BobFullLoginFailureSpikeTestThreshold
        expr: sum(increase(bobfull_business_events_total{job="bobfull-backend",event="LOGIN_FAILED"}[5m])) >= 20
        for: 0s
        labels:
          severity: warning
          category: security
          threshold: test
        annotations:
          summary: BobFull login failures crossed the initial test threshold
          description: LOGIN_FAILED occurred at least 20 times in 5 minutes. Tune after normal traffic measurement.
