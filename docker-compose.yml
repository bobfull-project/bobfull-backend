# Default local development:
#   docker compose up -d
#   -> starts only MySQL. Run Spring Boot directly from IntelliJ with the local profile.
#
# Docker app verification:
#   docker compose --profile app up --build -d
#   -> starts MySQL and the Spring Boot app container together.
services:
  mysql:
    image: mysql:8.4
    container_name: bobfull-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - bobfull-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: bobfull-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - bobfull-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    container_name: bobfull-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    volumes:
      - bobfull-kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    profiles:
      - app

    build:
      context: .
      dockerfile: Dockerfile
    image: bobfull-backend:local
    container_name: bobfull-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY:-}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
      PAYMENT_EXPIRATION_ENABLED: ${PAYMENT_EXPIRATION_ENABLED:-true}
      PAYMENT_EXPIRATION_FIXED_DELAY: ${PAYMENT_EXPIRATION_FIXED_DELAY:-60s}
      PAYMENT_EXPIRATION_BATCH_SIZE: ${PAYMENT_EXPIRATION_BATCH_SIZE:-100}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_IMAGE_BUCKET: ${S3_IMAGE_BUCKET:-}

    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  bobfull-mysql-data:
  bobfull-redis-data:
  bobfull-kafka-data:
