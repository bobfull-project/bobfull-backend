name: Copilot Auto PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    name: Request independent Copilot review
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot as PR reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
